name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # VITE_BASE_PATH debe ser "/<nombre-del-repo>/" si se publica en
      # https://usuario.github.io/<nombre-del-repo>/, o "/" si es un
      # dominio propio. Ajustar aquí o como variable del repositorio.
      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_AAD_CLIENT_ID: ${{ vars.VITE_AAD_CLIENT_ID }}
          VITE_AAD_TENANT_ID: ${{ vars.VITE_AAD_TENANT_ID }}
          VITE_AAD_REDIRECT_URI: ${{ vars.VITE_AAD_REDIRECT_URI }}
          VITE_SP_HOSTNAME: ${{ vars.VITE_SP_HOSTNAME }}
          VITE_SP_SITE_PATH: ${{ vars.VITE_SP_SITE_PATH }}
          VITE_SP_EVIDENCIAS_LIBRARY: ${{ vars.VITE_SP_EVIDENCIAS_LIBRARY }}
        run: npm run build

      # Antes se usaba actions/deploy-pages (la API "de publicación" nueva
      # de GitHub), pero esa API se quedó atascada repetidamente en
      # "deployment_queued" sin avanzar nunca (un problema del lado de
      # GitHub, no del código). Esta acción evita esa API por completo: en
      # vez de "publicar" mediante una llamada especial, simplemente sube
      # el contenido de dist/ a la rama gh-pages con un commit normal de
      # git — el mecanismo clásico y más simple de GitHub Pages, que no
      # depende de esa cola que se estaba trabando.
      - name: Deploy a la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
