name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # VITE_BASE_PATH debe ser "/<nombre-del-repo>/" si se publica en
      # https://usuario.github.io/<nombre-del-repo>/, o "/" si es un
      # dominio propio. Ajustar aquí o como variable del repositorio.
      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_AAD_CLIENT_ID: ${{ vars.VITE_AAD_CLIENT_ID }}
          VITE_AAD_TENANT_ID: ${{ vars.VITE_AAD_TENANT_ID }}
          VITE_AAD_REDIRECT_URI: ${{ vars.VITE_AAD_REDIRECT_URI }}
          VITE_SP_HOSTNAME: ${{ vars.VITE_SP_HOSTNAME }}
          VITE_SP_SITE_PATH: ${{ vars.VITE_SP_SITE_PATH }}
          VITE_SP_EVIDENCIAS_LIBRARY: ${{ vars.VITE_SP_EVIDENCIAS_LIBRARY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
